
<main>

  <h1> {{ title }} </h1>

  <p>
    Total: {{ store.totalTareas() }} |
    Completadas: {{ store.completadas() }} |
    Pendientes: {{ store.pendientes() }}
  </p>

  <div class="formulario-borde">
    <app-task-form
      (agregado)="store.agregar($event)"> 
    </app-task-form>
  </div>



  <div class="acciones-centro">
   <button (click)="store.limpiarCompletadas();" [disabled]="store.completadas() === 0">Eliminar Completadas</button>
  </div>
 
 

  <ul>
    @for (tareas of store.tareas(); track tareas.id) {
      <app-task-item 
        [task]="tareas" 
        (toggle)="store.toggle($event)" 
        (removed)="store.eliminar($event)">
      </app-task-item>
    } @empty {
      <li> No hay tareas !! Agrega una !!  </li>
  }
</ul> 



</main>
<router-outlet />
