
<main>
  <h1> {{ title }} </h1>

  <p>
    Total: {{ totalTareas() }} |
    Completadas: {{ completadas() }} |
    Pendientes: {{ pendientes() }}
  </p>

  <div class="nueva-tarea">
    <input type="text"  #inputTarea placeholder="Nueva Tarea" 
    (keyup.enter)="agregarTarea(inputTarea.value); inputTarea.value = ''" />
   
   <button (click)="agregarTarea(inputTarea.value); inputTarea.value = ''">Agregar</button>
 
 
  </div>


  <ul>
 @for (tarea of tarea(); track tarea.id) {
   <li (click)="tuggle(tarea.id)" [class.hecha]="tarea.completada"> 
       {{ tarea.titulo }}
        @if(tarea.completada){
          <span>OK</span>
         
        }

         <button (click)="eliminarTarea(tarea.id)">Eliminar</button>
   </li>

 } @empty {
  <li> No hay tareas !! Agerga una !!  </li>
 }
</ul> 



</main>






<router-outlet />
